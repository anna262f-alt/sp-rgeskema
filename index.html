```html
<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#4285f4">

  <title>Spørgeskema</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom)
        20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .ikon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #4285f4;
      color: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(66,133,244,0.35);
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 28px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 3px rgba(66,133,244,0.15);
    }

    textarea {
      resize: vertical;
      min-height: 130px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #4285f4;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #3367d6;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #besked {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      color: #188038;
      background: #e6f4ea;
    }

    .error {
      color: #d93025;
      background: #fce8e6;
    }

    #svarFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .container {
        margin: 15px auto;
        padding: 24px 20px;
        border-radius: 14px;
      }

      .ikon {
        width: 70px;
        height: 70px;
        font-size: 45px;
      }

      h1 {
        font-size: 25px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="ikon">?</div>

    <h1>Spørgeskema</h1>

    <p class="intro">
      Udfyld venligst spørgeskemaet nedenfor.
    </p>

    <form
      id="formular"
      method="POST"
      action="https://script.google.com/macros/s/AKfycby9SV2I_rq9dmZFLhIWc8ptbDTluWWORrT_h2IDlm6N1OAkXKierngWGuLXNWyayEva/exec"
      target="svarFrame"
    >

      <label for="navn">
        Navn
      </label>

      <input
        type="text"
        id="navn"
        name="navn"
        autocomplete="name"
        required
      >

      <label for="alder">
        Alder
      </label>

      <input
        type="number"
        id="alder"
        name="alder"
        min="1"
        max="120"
        inputmode="numeric"
        required
      >

      <label for="fritid">
        Hvad laver du i din fritid?
      </label>

      <textarea
        id="fritid"
        name="fritid"
        required
      ></textarea>

      <button type="submit" id="sendKnap">
        Send svar
      </button>

    </form>

    <iframe
      name="svarFrame"
      id="svarFrame"
      title="Svar"
    ></iframe>

    <div id="besked"></div>

  </div>


  <script>

    const form = document.getElementById("formular");
    const button = document.getElementById("sendKnap");
    const besked = document.getElementById("besked");

    let sender = false;


    /*
     * Formularen sendes til Google Apps Script.
     */

    form.addEventListener("submit", function() {

      sender = true;

      button.disabled = true;
      button.textContent = "Sender...";

      besked.textContent = "";
      besked.className = "";

    });


    /*
     * Google Apps Script svarer inde i den skjulte iframe.
     *
     * Når iframe'en er færdig med at indlæse svaret,
     * betragter vi afsendelsen som gennemført.
     */

    document
      .getElementById("svarFrame")
      .addEventListener("load", function() {

        if (!sender) {
          return;
        }

        besked.textContent =
          "Tak! Dit svar er blevet sendt.";

        besked.className = "success";

        form.reset();

        button.disabled = false;
        button.textContent = "Send svar";

        sender = false;

      });

  </script>

</body>
</html>
```
