<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#4285f4">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Forslag"
  >

  <title>Forslag</title>

  <link rel="manifest" href="manifest.json">

  <link
    rel="icon"
    type="image/png"
    href="icons/icon-192.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .side {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .kort {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    .topbillede {
      width: 100%;
      height: auto;
      max-height: 350px;
      object-fit: cover;
      border-radius: 15px;
      display: block;
      margin-bottom: 22px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      text-align: center;
      font-size: 30px;
      color: #333;
    }

    .beskrivelse {
      text-align: center;
      line-height: 1.6;
      margin-bottom: 28px;
      color: #555;
      font-size: 17px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: Arial, Helvetica, sans-serif;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus {
      border-color: #4285f4;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .forslag {
      margin-top: 20px;
      padding: 18px;
      background: #f7f9fb;
      border-radius: 14px;
      border: 1px solid #e1e5e9;
    }

    .forslag-titel {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .fjern-knap {
      margin-top: 8px;
      background: transparent;
      border: none;
      color: #d32f2f;
      cursor: pointer;
      font-size: 14px;
      padding: 5px 0;
    }

    .fjern-knap:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    #tilfoejKnap {
      background: #e8f0fe;
      color: #1a73e8;
    }

    #tilfoejKnap:hover {
      background: #d8e6fd;
    }

    #sendKnap {
      background: #4285f4;
      color: white;
      margin-top: 25px;
    }

    #sendKnap:hover {
      background: #3367d6;
    }

    #sendKnap:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #besked {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    #besked.success {
      display: block;
      background: #e6f4ea;
      color: #137333;
    }

    #besked.error {
      display: block;
      background: #fce8e6;
      color: #c5221f;
    }

    .ikon {
      width: 55px;
      height: 55px;
      margin: 0 auto 10px auto;
      display: block;
    }

    @media (max-width: 600px) {
      .side {
        padding: 10px;
      }

      .kort {
        padding: 18px;
        border-radius: 15px;
      }

      h1 {
        font-size: 25px;
      }

      .beskrivelse {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="side">

    <div class="kort">

      <!-- Dit billede -->
      <img
        src="images/top.jpg"
        alt="Special Minds"
        class="topbillede"
      >

      <!-- Ikon -->
      <img
        src="icons/icon-192.png"
        alt=""
        class="ikon"
      >

      <h1>Special Minds infoskærm</h1>

      <div class="beskrivelse">
        <p>
          Vi vil gerne lave en touchskærm med info om, hvad der sker i huset.
        </p>

        <p>
          Hvis der er noget, du synes ville være fedt at kunne se på skærmen, så skriv det herunder. Det kunne fx. være frokostmenuen eller social aktiviteter.
        </p>
      </div>

      <form
        id="formular"
        method="POST"
        action="https://script.google.com/macros/s/AKfycby9SV2I_rq9dmZFLhIWc8ptbDTluWWORrT_h2IDlm6N1OAkXKierngWGuLXNWyayEva/exec"
        target="googleSheetFrame"
      >

        <!-- NAVN -->
        <label for="navn">
          Dit navn
        </label>

        <input
          type="text"
          id="navn"
          name="navn"
          placeholder="Skriv dit navn"
          required
          autocomplete="name"
        >

        <!-- FORSLAG -->
        <div id="forslagContainer">

          <div class="forslag">

            <div class="forslag-titel">
              Forslag 1
            </div>

            <textarea
              name="forslag"
              placeholder="Skriv dit forslag her..."
              required
            ></textarea>

          </div>

        </div>

        <!-- KNAP TIL FLERE FORSLAG -->
        <button
          type="button"
          id="tilfoejKnap"
        >
          + Lav endnu et forslag
        </button>

        <!-- SEND -->
        <button
          type="submit"
          id="sendKnap"
        >
          Send forslag
        </button>

      </form>

      <!-- BESKED -->
      <div id="besked"></div>

    </div>

  </div>

  <!-- Skjult iframe til Google Apps Script -->
  <iframe
    name="googleSheetFrame"
    id="googleSheetFrame"
    style="display:none;"
  ></iframe>

  <script src="app.js"></script>

</body>
</html>
