<!DOCTYPE html>
<html lang="da">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#4285f4"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Spørgeskema"
  >

  <title>Spørgeskema</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    href="icons/icon-192.png"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;

      margin: 40px auto;

      padding: 30px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.10);
    }

    .icon {
      width: 80px;
      height: 80px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #4285f4;
      color: white;

      border-radius: 20px;

      font-size: 52px;
      font-weight: bold;

      box-shadow:
        0 5px 15px
        rgba(66, 133, 244, 0.35);
    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: 28px;
    }

    .intro {
      margin: 10px 0 30px;

      text-align: center;

      color: #666;
    }

    label {
      display: block;

      margin-top: 20px;
      margin-bottom: 7px;

      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;

      padding: 14px;

      border: 1px solid #ccc;
      border-radius: 8px;

      font-size: 16px;
      font-family: inherit;

      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #4285f4;

      box-shadow:
        0 0 0 3px
        rgba(66, 133, 244, 0.15);
    }

    textarea {
      min-height: 130px;

      resize: vertical;
    }

    button {
      width: 100%;

      margin-top: 25px;

      padding: 15px;

      border: none;
      border-radius: 8px;

      background: #4285f4;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #3367d6;
    }

    button:disabled {
      background: #999;

      cursor: not-allowed;
    }

    #besked {
      margin-top: 20px;

      padding: 12px;

      border-radius: 8px;

      text-align: center;

      font-weight: bold;
    }

    .success {
      color: #188038;
      background: #e6f4ea;
    }

    .error {
      color: #d93025;
      background: #fce8e6;
    }

    #installKnap {
      display: none;

      background: #202124;
    }

    #installKnap:hover {
      background: #000;
    }

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .container {
        margin: 15px auto;

        padding: 24px 20px;
      }

      .icon {
        width: 70px;
        height: 70px;

        font-size: 45px;
      }

      h1 {
        font-size: 25px;
      }
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="icon">
      ?
    </div>

    <h1>
      Spørgeskema
    </h1>

    <p class="intro">
      Udfyld venligst spørgeskemaet nedenfor.
    </p>

    <form id="formular">

      <label for="navn">
        Navn
      </label>

      <input
        type="text"
        id="navn"
        name="navn"
        autocomplete="name"
        required
      >

      <label for="alder">
        Alder
      </label>

      <input
        type="number"
        id="alder"
        name="alder"
        min="1"
        max="120"
        inputmode="numeric"
        required
      >

      <label for="fritid">
        Hvad laver du i din fritid?
      </label>

      <textarea
        id="fritid"
        name="fritid"
        required
      ></textarea>

      <button
        type="submit"
        id="sendKnap"
      >
        Send svar
      </button>

    </form>

    <button
      type="button"
      id="installKnap"
    >
      📱 Installér app
    </button>

    <div id="besked"></div>

  </div>

  <script src="app.js"></script>

</body>

</html>
